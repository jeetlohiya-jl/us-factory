# Builds MakeID's official SDK demo app (unchanged) into an APK, to test
# whether the MakeID Android SDK can print to our D50 -- before we build our
# own "Factory Print" helper app on that SDK.
#
# Run it: GitHub -> Actions -> "Build MakeID demo APK" -> Run workflow.
# When it finishes (about 5 minutes), download the APK from the run's
# "Artifacts" section (makeid-demo-apk.zip -> app-debug.apk).
name: Build MakeID demo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get MakeID's SDK + demo (github.com/MakeID-Developer/label-print)
        uses: actions/checkout@v5
        with:
          repository: MakeID-Developer/label-print
          path: label-print

      - name: Java 17 (needed by Android Gradle Plugin 8.10)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu runners already include the Android SDK
      # ($ANDROID_HOME). The setup-android action is NOT used: it tries to
      # install the long-removed "tools" package and fails.
      - name: Android platform 35 + build tools (demo uses compileSdk 35)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Android SDK: $ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build the demo APK
        working-directory: label-print/Android/MakeIDPrintDemo
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: makeid-demo-apk
          path: label-print/Android/MakeIDPrintDemo/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
